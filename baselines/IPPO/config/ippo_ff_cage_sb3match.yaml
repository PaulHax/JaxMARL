# Config to match SB3's PPO hyperparameters
# Key differences from default JaxMARL:
#   - 256x256 network (vs 64x64)
#   - Minibatch size 64 (vs 512)
#   - 10 epochs (vs 4)
#   - ent_coef 0.0 (vs 0.05)

"LR": 3e-4
"NUM_ENVS": 8
"NUM_STEPS": 256  # 8*256 = 2048 total, matching SB3's n_steps=2048
"TOTAL_TIMESTEPS": 3e6
"UPDATE_EPOCHS": 10
"NUM_MINIBATCHES": 32  # 2048/32 = 64 minibatch size, matching SB3
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.0  # SB3 uses 0.0
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"HIDDEN_DIM": 256  # Match SB3's 256x256
"ENV_NAME": "HeuristicRedCAGE"
"ENV_KWARGS":
  scenario: "Scenario2"
  max_steps: 100
"ANNEAL_LR": True
"SEED": 0
"NUM_SEEDS": 1

# Logging
"MLFLOW_EXPERIMENT": "cage-training"
"EXPERIMENT_DIR": "experiments"

# CybORG Evaluation
"EVAL_INTERVAL": 0
"EVAL_EPISODES": 10
"CYBORG_PATH": "/home/paulhax/src/cyber/cage-challenge-2/CybORG"
